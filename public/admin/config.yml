# Decap CMS — configuração das coleções editáveis (Fase 5, task-001-migracao-stack).
#
# Ficheiro PÚBLICO por construção — servido tal e qual ao browser. NUNCA
# colocar aqui client_secret, chaves privadas ou qualquer segredo
# (restrição vinculativa 1 da arquitetura). O controlo de acesso real vive
# no GitHub (quem tem permissão de escrita no repositório) e nas rotas de
# servidor do proxy OAuth, nunca neste ficheiro.
#
# IMPORTANTE — leitura antes de configurar um ambiente novo (Fase 0 /
# devops-engineer, ver handoff-38-developer-fase5.md):
# `backend.base_url` TEM de ser exatamente igual, byte a byte, à variável
# de ambiente de servidor `OAUTH_ALLOWED_ORIGIN` desse deployment (produção
# ou sandbox de preview). São a mesma origem vista de dois sítios — se
# divergirem, o handshake do postMessage falha silenciosamente (o Decap
# rejeita a mensagem porque a origem não bate certo). Este ficheiro estático
# não pode ler variáveis de ambiente; manter os dois sincronizados é
# responsabilidade de quem faz o deploy, documentada aqui de propósito.

backend:
  name: github
  repo: AgroTrades/agrotrades
  branch: main
  base_url: http://localhost:3000
  auth_endpoint: api/auth

# Traduz os textos da PRÓPRIA interface do Decap (botões, mensagens de erro,
# fluxo de trabalho editorial) — os rótulos dos campos já vinham traduzidos
# via `label:` em cada campo abaixo, isto trata do resto. Requer
# `CMS.registerLocale("pt", ...)` ter corrido antes (ver public/admin/index.html).
locale: pt

# editorial_workflow (não commits diretos): restrição vinculativa 28 da
# arquitetura — main fica protegida (PR + revisão de terceiro) antes de
# existir um segundo colaborador. O editorial_workflow é o modo de
# funcionamento coerente com essa proteção, não uma opção paralela.
publish_mode: editorial_workflow

media_folder: public/images/uploads
public_folder: /images/uploads

# BUG CORRIGIDO (achado ao testar /admin num browser real pela primeira vez,
# fora de qualquer handoff de segurança): esta secção tinha uma chave
# `media_library:` com `max_file_size: 5000000`. O schema do Decap 3.15.1
# exige `media_library.name` quando essa chave existe — sem ele, o CMS nem
# carrega ("'media_library' must have required property 'name'"). E definir
# `name` dispara "Missing external media library 'X'. Please use
# 'registerMediaLibrary'", porque essa chave serve SÓ para media libraries
# de terceiros (Cloudinary/Uploadcare), nunca para o backend git por
# omissão que este projeto usa. Ou seja: `max_file_size` aqui nunca esteve
# realmente ativo — era configuração morta que ninguém tinha testado num
# browser real. Removida.
#
# SEC-P5-03/SEC-P5-09 — restrição de tipo de ficheiro NÃO é possível aqui:
# a media library embutida do Decap (backend "github", sem integração de
# terceiros) não expõe nenhuma chave de config.yml para restringir
# extensões/MIME types aceites; o `<input type="file">` do widget "image"
# usa sempre `accept="image/*"` fixo no código do Decap, o que inclui SVG.
# A defesa real é o required check `media-guard`
# (.github/workflows/media-guard.yml) na proteção do branch `main` — a CSP
# de next.config.mjs (`/images/uploads/:path*`) é só defesa em
# profundidade, contornável via `%2F` codificado (SEC-P5-09). Ver
# handoff-44/46/47-security-engineer-*.md para o raciocínio completo.
# Limite de tamanho é imposto do lado do servidor pelo mesmo `media-guard`
# (5 MB, `MAX_SIZE` no workflow) — não pelo Decap.

# noindex "físico" da página está em public/admin/index.html (meta tag) e em
# app/robots.ts (Disallow: /admin) — aqui não há nada de SEO a configurar.

collections:
  # ── SERVIÇOS (8 ficheiros fixos, content/services/*.json) ────────────────
  - name: services
    label: "Serviços"
    label_singular: "Serviço"
    folder: content/services
    extension: json
    format: json
    create: false # a contagem de 8 é fixa (servicesSchema.length(8)) — não criar/apagar por aqui
    delete: false
    identifier_field: id
    summary: "{{title.pt}}"
    fields:
      - { label: "ID (não alterar)", name: id, widget: string, required: true, hint: "Identificador técnico do serviço — não mudar depois de criado." }
      - label: "Ícone"
        name: icon
        widget: select
        options: [wheat, corn, tractor, factory, landPlot, support, handshake, calendar, mapPin, building, leaf, target, eye, bolt, trophy]
      - label: "Título"
        name: title
        widget: object
        fields:
          - { label: "Português", name: pt, widget: string, required: true }
          - { label: "English", name: en, widget: string, required: true }
      - label: "Resumo"
        name: summary
        widget: object
        fields:
          - { label: "Português", name: pt, widget: text, required: true }
          - { label: "English", name: en, widget: text, required: true }
      - label: "Descrição completa"
        name: description
        widget: object
        fields:
          - { label: "Português", name: pt, widget: text, required: true }
          - { label: "English", name: en, widget: text, required: true }
      - label: "Destaques (bullets)"
        name: highlights
        widget: object
        fields:
          - { label: "Português", name: pt, widget: list, field: { label: "Item", name: item, widget: string }, required: true }
          - { label: "English", name: en, widget: list, field: { label: "Item", name: item, widget: string }, required: true }
      - label: "Título curto (cartão da homepage)"
        name: homeTitle
        widget: object
        required: false
        fields:
          - { label: "Português", name: pt, widget: string, required: true }
          - { label: "English", name: en, widget: string, required: true }
      - label: "Resumo curto (cartão da homepage)"
        name: homeBlurb
        widget: object
        required: false
        fields:
          - { label: "Português", name: pt, widget: text, required: true }
          - { label: "English", name: en, widget: text, required: true }
      - { label: "Imagem de banner (hero do detalhe + cartão)", name: bannerImage, widget: image, required: true }
      - label: "Texto alternativo do banner"
        name: bannerImageAlt
        widget: object
        fields:
          - { label: "Português", name: pt, widget: string, required: true }
          - { label: "English", name: en, widget: string, required: true }
      - label: "Secções temáticas (opcional)"
        name: sections
        widget: list
        required: false
        min: 1
        max: 6
        fields:
          - { label: "Secção visível", name: visible, widget: boolean, default: true }
          - label: "Ícone (vazio = usa o ícone do serviço)"
            name: icon
            widget: select
            required: false
            options: [wheat, corn, tractor, factory, landPlot, support, handshake, calendar, mapPin, building, leaf, target, eye, bolt, trophy]
          - label: "Título"
            name: title
            widget: object
            fields:
              - { label: "Português", name: pt, widget: string, required: true }
              - { label: "English", name: en, widget: string, required: true }
          - label: "Texto"
            name: text
            widget: object
            fields:
              - { label: "Português", name: pt, widget: text, required: true }
              - { label: "English", name: en, widget: text, required: true }
          - label: "Imagem (opcional)"
            name: image
            widget: object
            required: false
            fields:
              - { label: "Imagem", name: image, widget: image, required: false }
              - label: "Texto alternativo"
                name: alt
                widget: object
                required: false
                fields:
                  - { label: "Português", name: pt, widget: string, required: false }
                  - { label: "English", name: en, widget: string, required: false }
          - { label: "Layout (só com imagem)", name: layout, widget: select, options: [split, feature], required: false }
          - label: "Bullets (só com imagem)"
            name: bullets
            widget: object
            required: false
            fields:
              - { label: "Português", name: pt, widget: list, field: { label: "Item", name: item, widget: string }, required: true }
              - { label: "English", name: en, widget: list, field: { label: "Item", name: item, widget: string }, required: true }
      - { label: "Secção de galeria visível", name: galleryVisible, widget: boolean, default: true }
      - label: "Galeria de imagens (opcional)"
        name: gallery
        widget: list
        required: false
        min: 1
        max: 6
        fields:
          - { label: "Imagem visível", name: visible, widget: boolean, default: true }
          - { label: "Imagem", name: image, widget: image, required: true }
          - label: "Texto alternativo"
            name: alt
            widget: object
            fields:
              - { label: "Português", name: pt, widget: string, required: true }
              - { label: "English", name: en, widget: string, required: true }

  # ── CONTEÚDO DO SITE (ficheiros únicos, content/site/*.json) ─────────────
  #
  # Uma entrada por PÁGINA REAL do site (Homepage, Quem Somos, Serviços,
  # Campanha, Contactos), não uma por ficheiro técnico — para que editar uma
  # página não obrigue a saltar entre várias entradas do menu. Alguns campos
  # são mostrados em mais do que uma página (ex.: o resumo "sobre a empresa"
  # aparece na Homepage E em Quem Somos); nesses casos o campo vive na
  # página onde faz mais sentido editorialmente e as outras páginas lêem o
  # mesmo valor à distância — nunca duplicado (evita dessincronizar
  # traduções). Assinalado com "hint" no campo de origem.
  - name: site
    label: "Site"
    files:
      - name: nav
        label: "Navegação"
        file: content/site/nav.json
        fields:
          - label: "Início"
            name: home
            widget: object
            fields:
              - { label: "Visível (menu e rodapé)", name: visible, widget: boolean, default: true }
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - label: "Serviços"
            name: services
            widget: object
            fields:
              - { label: "Visível (menu e rodapé)", name: visible, widget: boolean, default: true }
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - label: "Campanha"
            name: campaign
            widget: object
            fields:
              - { label: "Visível (menu e rodapé)", name: visible, widget: boolean, default: true }
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - label: "Contactos"
            name: contact
            widget: object
            fields:
              - { label: "Visível (menu e rodapé)", name: visible, widget: boolean, default: true }
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - label: "Quem Somos"
            name: about
            widget: object
            fields:
              - { label: "Visível (menu e rodapé)", name: visible, widget: boolean, default: true }
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - label: "\"Ver todos os serviços\""
            name: servicesViewAll
            widget: object
            fields:
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }

      - name: home
        label: "Homepage"
        file: content/site/home.json
        fields:
          - label: "Hero (topo da homepage)"
            name: hero
            widget: object
            fields:
              - label: "Etiqueta"
                name: tag
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: string }
                  - { label: "English", name: en, widget: string }
              - label: "Título — linha 1"
                name: titleLine1
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: string }
                  - { label: "English", name: en, widget: string }
              - label: "Título — linha 2"
                name: titleLine2
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: string }
                  - { label: "English", name: en, widget: string }
              - label: "Lema/citação"
                name: motto
                widget: object
                hint: "Também aparece na citação da página /campanha."
                fields:
                  - { label: "Português", name: pt, widget: string }
                  - { label: "English", name: en, widget: string }
              - label: "Texto"
                name: text
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: text }
                  - { label: "English", name: en, widget: text }
              - label: "Botões"
                name: buttons
                widget: object
                fields:
                  - label: "Botão WhatsApp"
                    name: whatsapp
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: string }
                      - { label: "English", name: en, widget: string }
                  - label: "Botão Serviços"
                    name: services
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: string }
                      - { label: "English", name: en, widget: string }
              - label: "Slider de fundo"
                name: slider
                widget: object
                fields:
                  - label: "Rótulo do carrossel"
                    name: label
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: string }
                      - { label: "English", name: en, widget: string }
                  - label: "\"Slide anterior\""
                    name: previousLabel
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: string }
                      - { label: "English", name: en, widget: string }
                  - label: "\"Próximo slide\""
                    name: nextLabel
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: string }
                      - { label: "English", name: en, widget: string }
                  - label: "\"Ir para o slide {n}\" — tem de conter {n}"
                    name: goToSlideLabel
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: string }
                      - { label: "English", name: en, widget: string }
                  - label: "Slides (imagem ou vídeo)"
                    name: slides
                    widget: list
                    min: 1
                    max: 6
                    types:
                      - name: image
                        label: "Slide de imagem"
                        widget: object
                        fields:
                          - { label: "Visível", name: visible, widget: boolean, default: true }
                          - { label: "Tipo (não alterar)", name: type, widget: hidden, default: image }
                          - { label: "Imagem", name: image, widget: image, required: true }
                          - label: "Texto alternativo"
                            name: alt
                            widget: object
                            fields:
                              - { label: "Português", name: pt, widget: string, required: true }
                              - { label: "English", name: en, widget: string, required: true }
                      - name: video
                        label: "Slide de vídeo (YouTube)"
                        widget: object
                        fields:
                          - { label: "Visível", name: visible, widget: boolean, default: true }
                          - { label: "Tipo (não alterar)", name: type, widget: hidden, default: video }
                          - label: "ID do vídeo do YouTube"
                            name: youtubeId
                            widget: string
                            required: true
                            pattern: ["^[A-Za-z0-9_-]{11}$", "Indique apenas o ID do vídeo (11 caracteres), não o URL completo"]
                          - label: "Legenda / descrição do vídeo"
                            name: caption
                            widget: object
                            fields:
                              - { label: "Português", name: pt, widget: string, required: true }
                              - { label: "English", name: en, widget: string, required: true }
          - label: "Estatísticas (stats-bar)"
            name: stats
            widget: object
            fields:
              - label: "Estatísticas (exatamente 4)"
                name: items
                widget: list
                min: 4
                max: 4
                fields:
                  - { label: "Visível", name: visible, widget: boolean, default: true }
                  - { label: "Valor (ex.: \"2+\", \"8\", \"MZ\")", name: value, widget: string, required: true }
                  - label: "Rótulo"
                    name: label
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: string, required: true }
                      - { label: "English", name: en, widget: string, required: true }
          - label: "Secção \"Localização\" (título — as localizações em si vivem em Contactos)"
            name: locationsHeading
            widget: object
            fields:
              - label: "Etiqueta"
                name: tag
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: string }
                  - { label: "English", name: en, widget: string }
              - label: "Título"
                name: title
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: string }
                  - { label: "English", name: en, widget: string }
          - label: "Sobre a empresa — resumo (continuação)"
            name: about
            widget: object
            hint: "A etiqueta, título, 1º parágrafo e etiquetas (about-tags) são geridos em \"Quem Somos\" — aparecem aqui também."
            fields:
              - label: "Resumo — 2º parágrafo"
                name: extended
                widget: object
                fields:
                  - { label: "Visível", name: visible, widget: boolean, default: true }
                  - { label: "Português", name: pt, widget: text }
                  - { label: "English", name: en, widget: text }
              - label: "CEO"
                name: ceo
                widget: object
                fields:
                  - { label: "Visível", name: visible, widget: boolean, default: true }
                  - { label: "Nome", name: name, widget: string, required: true }
                  - { label: "Iniciais", name: initials, widget: string, required: true }
                  - label: "Cargo"
                    name: role
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: string }
                      - { label: "English", name: en, widget: string }
              - label: "\"Saber mais\""
                name: learnMoreLabel
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: string }
                  - { label: "English", name: en, widget: string }

      - name: quemSomos
        label: "Quem Somos"
        file: content/site/quemSomos.json
        fields:
          - label: "Etiqueta"
            name: tag
            widget: object
            hint: "Também aparece no resumo \"Sobre a empresa\" da Homepage."
            fields:
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - label: "Título"
            name: title
            widget: object
            hint: "Também aparece no resumo \"Sobre a empresa\" da Homepage."
            fields:
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - label: "Resumo — 1º parágrafo"
            name: summary
            widget: object
            hint: "Também aparece no resumo \"Sobre a empresa\" da Homepage (o 2º parágrafo é editado lá)."
            fields:
              - { label: "Português", name: pt, widget: text }
              - { label: "English", name: en, widget: text }
          - label: "Texto institucional completo"
            name: fullText
            widget: list
            min: 1
            fields:
              - { label: "Visível", name: visible, widget: boolean, default: true }
              - { label: "Português", name: pt, widget: text }
              - { label: "English", name: en, widget: text }
          - label: "Etiquetas (about-tags)"
            name: tags
            widget: list
            min: 1
            hint: "Também aparecem no resumo \"Sobre a empresa\" da Homepage."
            fields:
              - { label: "Visível", name: visible, widget: boolean, default: true }
              - label: "Ícone"
                name: icon
                widget: select
                options: [wheat, corn, tractor, factory, landPlot, support, handshake, calendar, mapPin, building, leaf, target, eye, bolt, trophy]
              - label: "Rótulo"
                name: label
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: string, required: true }
                  - { label: "English", name: en, widget: string, required: true }
          - { label: "Imagem de banner", name: bannerImage, widget: image, required: true }
          - label: "Texto alternativo do banner"
            name: bannerImageAlt
            widget: object
            fields:
              - { label: "Português", name: pt, widget: string, required: true }
              - { label: "English", name: en, widget: string, required: true }
          - label: "Etiqueta da secção equipa"
            name: teamTag
            widget: object
            fields:
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - label: "Título da secção equipa"
            name: teamHeading
            widget: object
            fields:
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - label: "Etiqueta da secção valores"
            name: valuesTag
            widget: object
            fields:
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - label: "Título da secção valores"
            name: valuesHeading
            widget: object
            fields:
              - { label: "Português", name: pt, widget: string }
              - { label: "English", name: en, widget: string }
          - { label: "Secção de valores visível", name: valuesVisible, widget: boolean, default: true }
          - label: "Valores institucionais (exatamente 6: Missão, Visão, Sustentabilidade, Parceria, Inovação, Excelência)"
            name: values
            widget: list
            min: 6
            max: 6
            fields:
              - { label: "Visível", name: visible, widget: boolean, default: true }
              - label: "Ícone"
                name: icon
                widget: select
                options: [wheat, corn, tractor, factory, landPlot, support, handshake, calendar, mapPin, building, leaf, target, eye, bolt, trophy]
              - label: "Título"
                name: title
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: string, required: true }
                  - { label: "English", name: en, widget: string, required: true }
              - label: "Texto"
                name: text
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: text, required: true }
                  - { label: "English", name: en, widget: text, required: true }
          - label: "Equipa"
            name: team
            widget: object
            fields:
              - label: "Membros da equipa (o primeiro é o cartão destacado)"
                name: items
                widget: list
                min: 1
                fields:
                  - { label: "Visível", name: visible, widget: boolean, default: true }
                  - { label: "Nome", name: nome, widget: string, required: true }
                  - label: "Cargo"
                    name: cargo
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: string }
                      - { label: "English", name: en, widget: string }
                  - { label: "Foto", name: foto, widget: image, required: true }
                  - label: "Frase curta"
                    name: frase
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: string, required: false }
                      - { label: "English", name: en, widget: string, required: false }
                  - label: "Bio longa — só o cartão destacado"
                    name: bio
                    widget: object
                    fields:
                      - { label: "Português", name: pt, widget: text, required: false }
                      - { label: "English", name: en, widget: text, required: false }
                  - label: "Badges de especialidade (opcional, até 5)"
                    name: badges
                    widget: list
                    required: false
                    min: 1
                    max: 5
                    fields:
                      - { label: "Português", name: pt, widget: string, required: true }
                      - { label: "English", name: en, widget: string, required: true }
                  - { label: "Telefone (opcional)", name: phone, widget: string, required: false }
                  - { label: "WhatsApp (opcional, formato internacional, ex.: +351912345678)", name: whatsapp, widget: string, required: false }
                  - { label: "Email (opcional)", name: email, widget: string, required: false }

      - name: campanha
        label: "Campanha"
        file: content/site/campanha.json
        fields:
          - label: "Banner (homepage)"
            name: banner
            widget: object
            hint: "O título também é usado no hero desta página, logo abaixo."
            fields:
              - label: "Etiqueta"
                name: tag
                widget: object
                fields:
                  - { label: "Português", name: pt, widget: string }
